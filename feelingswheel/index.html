<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Feeling Wheel</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-wrapper">
  
  <div class="wheel-section">
    <div class="wheel-container" id="wheelContainer">
      <svg id="wheelSvg" viewBox="0 0 1000 1000">
        <!-- Rotatable wheel group -->
        <g id="wheelGroup" transform="rotate(0 500 500)"></g>
        <!-- Fixed center reset button on top -->
        <g id="centerResetGroup"></g>
      </svg>
    </div>
  </div>

  <div class="content-section">
    
    <!-- Unified Emotion Control Card -->
    <div class="card selected-emotion">
      <div id="breadcrumb" class="breadcrumb">
        <h2>Unselected</h2>
      </div>
      
      <!-- Search Bar -->
      <input type="text" class="search-bar" id="searchInput" placeholder="Search for a specific feeling..." oninput="searchEmotions()">
      
      <p id="emotionDef">Select an emotion from the wheel or search to read how it physically manifests in your body.</p>
      <input type="text" id="emotionNote" class="search-bar note-input" placeholder="Add a note to your check-in (optional)...">
      <button class="check-in-btn" id="logBtn" onclick="logEmotion()">Log this Emotion</button>
    </div>

    <!-- Recent Check-Ins -->
    <div class="card">
      <h2 style="font-size: 18px; text-align: left; margin:0; color: #fff; font-weight: 600;">Recent Check-Ins</h2>
      <ul class="log-list" id="logList"></ul>
    </div>
    
  </div>

</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
